[package]
name = "swtsm-setup"
version = "1.0.0"
edition = "2021"
description = "Installer for SwTsM"
authors = ["MrSnowman"]

[[bin]]
name = "SwTsM-Setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde_json = "1"
winreg = "0.52"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
